# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe_secret_key_test: '%env(STRIPE_SECRET_KEY_TEST)%'
    stripe_public_key: '%env(STRIPE_PUBLIC_KEY)%'
    stripe_public_key_test: '%env(STRIPE_PUBLIC_KEY_TEST)%'
    test_key: ''
    upload_directory: '%kernel.project_dir%/public/uploads'
    timezone: '%env(APP_TIMEZONE)%'
    # Plancher de numérotation des licences (voir App\Service\LicenceNumberGenerator) : aucun numéro inférieur n'est attribué
    env(LICENCE_FIRST_AVAILABLE): '1'
    app.licence_first_available: '%env(int:LICENCE_FIRST_AVAILABLE)%'
    # Envoi des cartes : « inline » = juste après l'inscription (par défaut), « cron » = uniquement par `app:licences:envoyer`
    env(LICENCE_CARDS_MODE): 'inline'
    app.licence_cards_mode: '%env(LICENCE_CARDS_MODE)%'
    # Nombre maximal d'essais d'envoi d'une carte, et délai entre deux essais (minutes)
    app.card_max_attempts: 5
    app.card_retry_minutes: 10
    # Dossier des cartes PDF générées (hors de public/ : données personnelles)
    app.licence_output_dir: '%kernel.project_dir%/var/licences'
    # Génération des PDF : autorise les ressources distantes (police Roboto de Google Fonts)
    app.pdf_remote_enabled: true
    # Secondes d'attente avant le nouvel essai d'un envoi d'e-mail en échec
    app.mail_retry_delay: 2

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\EventListener\TemplateListener:
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.controller', method: 'onKernelController' }

    App\EventListener\ExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

when@test:
    parameters:
        app.pdf_remote_enabled: false
        app.mail_retry_delay: 0
        app.licence_output_dir: '%kernel.cache_dir%/licences'
    services:
        # Public pour que les tests puissent le remplacer (pas d'appel réel à Stripe)
        App\Service\PaymentVerifierInterface:
            alias: App\Service\StripePaymentVerifier
            public: true
        App\Service\CheckoutGatewayInterface:
            alias: App\Service\StripeCheckoutGateway
            public: true
        App\Service\LicenseService:
            public: true
